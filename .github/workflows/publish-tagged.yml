name: Publish Tagged Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

jobs:
  build:
    name: "Build Changelog & Release Prod"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all modules
        run: npm ci

      - name: Create .env file
        run: |
          echo TXDEV_FXSERVER_PATH=$(pwd)/fxserver > .env
          echo TXDEV_VITE_URL='http://localhost:40122' >> .env

      - name: Build project
        run: |
          npm run build
          if [ -f .github/.cienv ]; then
            cat .github/.cienv >> $GITHUB_ENV
          fi

      - name: Compress build output with zip
        run: |
          cd dist
          zip -r ../monitor.zip .
          cd ..
          sha256sum monitor.zip

      - name: Create and Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: monitor.zip
          tag_name: ${{ github.ref_name || 'v8.0.1' }}
          name: txAdmin ${{ github.ref_name || 'v8.0.1' }} (Multi-Server Fork)
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
